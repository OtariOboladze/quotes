<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="viewport" content="width=600">
  <style>
    table {
      font-size: 18px;
    }

    th {
      background-color: #eee;
      color: #000;
    }

    td {
      padding: 8px;
    }
  </style>
</head>


<body>
  <h1>ამინდი ხვალ, ზეგ და მაზეგ პატალა კუნასთვის.</h1>
  <div id="weather-box">Loading tomorrow's weather...</div>

  <script>


    var apiKey = "1a5e3322cfe07ebbea2e0612d761753d";
    var city = "Barcelona"; // or your city
    var url = "https://api.openweathermap.org/data/2.5/forecast?q=" + city + "&appid=" + apiKey + "&units=metric";

    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);

    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          var data = JSON.parse(xhr.responseText);
          displayThreeDayForecast(data);
        } else {
          console.log("Error fetching weather: " + xhr.status);
        }
      }
    };

    function displayThreeDayForecast(data) {
      var forecastList = data.list;
      var html = '<table border="1" style="width:100%; border-collapse: collapse; font-family: Arial, sans-serif;">';
      html += '<tr style="background-color: #cccccc;"><th>დღე</th><th>გრადუსი</th><th>ქარი</th><th>წნევა</th><th>ტენი</th></tr>';

      var daysFound = 0;

      for (var i = 0; i < forecastList.length; i++) {
        var item = forecastList[i];
        var timeStr = item.dt_txt;

        // Target 12:00:00 for a consistent daily snapshot
        if (timeStr.indexOf("12:00:00") !== -1 && daysFound < 3) {
          // Split "2026-05-04" into ["2026", "05", "04"]
          var dateParts = timeStr.split(" ")[0].split("-");
          // Rearrange to European Format: DD/MM
          var euroDate = dateParts[2] + "/" + dateParts[1];

          var temp = Math.round(item.main.temp) + " °C";
          var wind = Math.round(item.wind.speed) + " m/s";
          var pressure = item.main.pressure + " hPa";
          var humidity = item.main.humidity + " %";
          var desc = item.weather[0].main;

          html += '<tr style="text-align: center;">';
          html += '<td style="padding: 10px;"><strong>' + euroDate + '</strong><br><small>' + desc + '</small></td>';
          html += '<td>' + temp + '</td>';
          html += '<td>' + wind + '</td>';
          html += '<td>' + pressure + '</td>';
          html += '<td>' + humidity + '</td>';
          html += '</tr>';

          daysFound++;
        }
      }

      html += '</table>';
      document.getElementById("weather-box").innerHTML = html;
    }

    xhr.send();

  </script>
</body>

</html>
