<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quotes</title>
  </head>
  <body>
    <h1>აი შენ ინსპირაციული ფრაზა ჩემო კარგო ანანო:</h1>
    <h1 id="result"></h1>

    <script>
        function getBrowserInfo() {
            // Use 'var' instead of 'const' or 'let'
            var ua = navigator.userAgent;
            var tem;
            
            // Standard Regex for name/version
            var M = ua.match(/(opera|chrome|safari|firefox|msie|trident(?=\/))\/?\s*(\d+)/i) || [];
            
            // Handle IE/Trident
            if (/trident/i.test(M[1])) {
                tem = /\brv[ :]+(\d+)/g.exec(ua) || [];
                return { name: 'IE', version: (tem[1] || '') };
            }
            
            // Handle Edge and Opera
            if (M[1] === 'Chrome') {
                tem = ua.match(/\b(OPR|Edg)\/(\d+)/);
                if (tem != null) {
                    return { 
                        name: tem[1].replace('OPR', 'Opera'), 
                        version: tem[2] 
                    };
                }
            }
            
            M = M[2] ? [M[1], M[2]] : [navigator.appName, navigator.appVersion, '-?'];
            
            if ((tem = ua.match(/version\/(\d+)/i)) != null) {
                M.splice(1, 1, tem[1]);
            }
            
            return {
                name: M[0],
                version: M[1]
            };
        }

        // Usage: Avoid template literals (backticks)
        var browser = getBrowserInfo();
        console.log("Browser Name: " + browser.name + " | Version: " + browser.version);

        document.querySelector('#result').innerHTML = "Browser Name: " + browser.name + " | Version: " + browser.version



        // Conditional check for Kindle specifically
        if (navigator.userAgent.indexOf('Kindle') !== -1) {
            alert("You are viewing this on a Kindle!");
        }    
    </script>
  </body>
</html>
