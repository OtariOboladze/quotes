<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quotes</title>
  </head>
  <body>
    <h1>აი შენ ინსპირაციული ფრაზა ჩემო კარგო ანანო:</h1>
    <h1 id="result"></h1>

    <script>
            function getBrowserInfo() {
            const ua = navigator.userAgent;
            let tem;
            // Look for name/version matches
            let M = ua.match(/(opera|chrome|safari|firefox|msie|trident(?=\/))\/?\s*(\d+)/i) || [];
            
            // Handle IE/Trident
            if (/trident/i.test(M[1])) {
                tem = /\brv[ :]+(\d+)/g.exec(ua) || [];
                return { name: 'IE', version: (tem[1] || '') };
            }
            
            // Handle Edge and Opera (which contain "Chrome" in their UA)
            if (M[1] === 'Chrome') {
                tem = ua.match(/\b(OPR|Edg)\/(\d+)/);
                if (tem != null) return { name: tem[1].replace('OPR', 'Opera'), version: tem[2] };
            }
            
            M = M[2] ? [M[1], M[2]] : [navigator.appName, navigator.appVersion, '-?'];
            if ((tem = ua.match(/version\/(\d+)/i)) != null) M.splice(1, 1, tem[1]);
            
            return {
                name: M[0],
                version: M[1]
            };
        }

        const browser = getBrowserInfo();
        document.querySelector('#result').innerHTML = `You are using ${browser.name} version ${browser.version}`
        console.log(`You are using ${browser.name} version ${browser.version}`);
    </script>
  </body>
</html>
