<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quotes</title>
  </head>
  <body>
    <h1>აი შენ ინსპირაციული ფრაზა ჩემო კარგო ანანო:</h1>
    <h1 id="result"></h1>

    <script>
      var resultEl = document.getElementById("result");

      function setResultText(text) {
        if (!resultEl) return;
        if (typeof resultEl.textContent !== "undefined") resultEl.textContent = text;
        else resultEl.innerText = text; // old IE fallback
      }

      function safeJsonParse(str) {
        try {
          return JSON.parse(str);
        } catch (e) {
          return null;
        }
      }

      var xhr = new XMLHttpRequest();
      xhr.open(
        "GET",
        "https://api.api-ninjas.com/v2/randomquotes?categories=inspirational",
        true,
      );
      xhr.setRequestHeader("X-API-Key", "iuX7hWHPCUHmIOa15QqvUU1WTycvXGNcIChLb9eR");
      xhr.setRequestHeader("Accept", "application/json");

      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;

        var status = xhr.status;
        var contentType = xhr.getResponseHeader("content-type") || "";
        var raw = xhr.responseText;
        var body = contentType.indexOf("application/json") !== -1 ? safeJsonParse(raw) : raw;

        if (status < 200 || status >= 300) {
          setResultText(
            "Request failed (" +
              status +
              "): " +
              (typeof body === "string" ? body : raw),
          );
          return;
        }

        var quote = null;
        if (body && typeof body === "object") {
          if (Object.prototype.toString.call(body) === "[object Array]") {
            quote = body[0] && body[0].quote;
          } else {
            quote = body.quote;
          }
        }

        if (typeof quote === "string") setResultText(quote);
        else if (typeof body === "string") setResultText(body);
        else setResultText(raw);
      };

      xhr.onerror = function () {
        setResultText("Request failed: network error");
      };

      xhr.send(null);
    </script>
  </body>
</html>
