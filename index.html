<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quotes</title>
  </head>
  <body>
    <h1>აო:</h1>
    <h1 id="result"></h1>
    <div id="weather-box">Loading tomorrow's weather...</div>

    <script>


          var apiKey = "1a5e3322cfe07ebbea2e0612d761753d";
          var city = "Barcelona"; // or your city
          var url = "https://api.openweathermap.org/data/2.5/forecast?q=" + city + "&appid=" + apiKey + "&units=metric";

          var xhr = new XMLHttpRequest();
          xhr.open("GET", url, true);

          xhr.onreadystatechange = function() {
              if (xhr.readyState === 4) {
                  if (xhr.status === 200) {
                      var data = JSON.parse(xhr.responseText);
                      findTomorrowWeather(data);
                  } else {
                      console.log("Error fetching weather: " + xhr.status);
                  }
              }
          };

          function findTomorrowWeather(data) {
              // Get the timestamp for 24 hours from now
              var tomorrowTs = Math.floor(new Date().getTime() / 1000) + (24 * 60 * 60);
              var forecast = data.list[0]; // Fallback to first available

              // Find the entry closest to 24 hours from now
              for (var i = 0; i < data.list.length; i++) {
                  if (data.list[i].dt >= tomorrowTs) {
                      forecast = data.list[i];
                      break;
                  }
              }

              var temp = forecast.main.temp;
              var desc = forecast.weather[0].description;
              
              // Display on the Kindle screen
              var output = "Tomorrow: " + temp + "°C, " + desc;
              document.getElementById("weather-box").innerHTML = output;
          }

          xhr.send();


</script>
  </body>
</html>
